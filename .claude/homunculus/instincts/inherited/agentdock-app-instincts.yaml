# Agentdock App Workflow Feature Development Auth

## Action

Follow the feature-development-auth workflow:
1. Install or update authentication-related dependencies in package.json and pnpm-lock.yaml
2. Create or update authentication API routes under src/app/api/auth/
3. Implement or update authentication pages under src/app/auth/
4. Add or modify authentication-related components (e.g., user menu, session provider)
5. Update authentication logic in src/lib/auth.ts
6. Update types in src/types/next-auth.d.ts if needed
7. Update .env.example for new environment variables

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: package.json, pnpm-lock.yaml, .env.example

